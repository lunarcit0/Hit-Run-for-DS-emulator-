<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#000000"><title>The Simpsons: Hit & Run</title><link rel="icon" href="%BASE_URL%assets/ui/user.png"></head>
<body>
  <main id="game" aria-label="Hit and Run driving game"></main>
  <div id="loading" role="status"><img src="%BASE_URL%assets/ui/gamelogo.png" alt="The Simpsons Hit and Run"><div class="loading-track"><i id="load-progress"></i></div><p id="load-message">Loading…</p></div>
  <div id="hud" hidden>
    <div class="state-bridge" hidden aria-hidden="true">
      <span id="district"></span><span id="place-name"></span><span id="mode-badge">FREE DRIVE</span><span id="coin-count">0 / 0</span>
      <div id="challenge-hud"><span id="objective"></span><span id="checkpoint"></span><span id="timer"></span><i id="challenge-progress"></i></div>
      <div id="toast"></div><canvas id="minimap" width="360" height="360"></canvas><span id="map-caption"></span>
      <div id="drive-hints"></div><span id="car-label">FAMILY SEDAN</span><span id="gear">N</span><span id="speed">0</span><i id="speed-progress"></i><span id="condition">100%</span><i id="condition-progress"></i>
    </div>
    <div id="touch-controls" aria-label="Touch controller">
      <div class="pad-top">
        <button class="pad-pill" data-key="KeyB" aria-label="Look back">L1</button>
        <button class="pad-pill" data-key="KeyM" aria-label="Map">SELECT</button>
        <button id="pause" class="pad-pill touch-pause" aria-label="Pause game">START</button>
        <button class="pad-pill" data-key="KeyC" aria-label="Change camera">R1</button>
        <button class="pad-pill pad-reset" data-key="KeyR" aria-label="Reset to the road">↺</button>
      </div>
      <div id="touch-stick" aria-label="Movement stick"><div class="stick-base"><div class="stick-knob"></div></div></div>
      <div class="pad-face">
        <button class="pad-btn triangle" data-key="KeyE" aria-label="Get in or out, talk"><svg viewBox="0 0 40 40"><path d="M20 8 33 30H7Z"/></svg><span>ACTION</span></button>
        <button class="pad-btn square" data-key-car="KeyS" data-key-foot="KeyF" aria-label="Brake and reverse, or kick"><svg viewBox="0 0 40 40"><rect x="9" y="9" width="22" height="22"/></svg><span class="car">BRAKE</span><span class="foot">KICK</span></button>
        <button class="pad-btn circle" data-key-car="Space" data-key-foot="ShiftLeft" aria-label="Handbrake, or run"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="12"/></svg><span class="car">E-BRAKE</span><span class="foot">RUN</span></button>
        <button class="pad-btn cross" data-key-car="KeyW" data-key-foot="Space" aria-label="Accelerate, or jump"><svg viewBox="0 0 40 40"><path d="M10 10 30 30M30 10 10 30"/></svg><span class="car">GAS</span><span class="foot">JUMP</span></button>
      </div>
    </div>
  </div>
  <section id="menu" hidden aria-label="Game menu">
    <div class="state-bridge" hidden aria-hidden="true"><button id="play"><span>Continue</span></button><button id="challenge">Springfield Run</button><span id="menu-place"></span><span id="scene-info"></span></div>
    <div class="settings-grid" hidden>
      <label>LEVEL<select id="level"><option value="1">1 · Homer</option><option value="2">2 · Bart</option><option value="3">3 · Lisa</option><option value="4">4 · Marge</option><option value="5">5 · Apu</option><option value="6">6 · Bart</option><option value="7">7 · Homer</option></select></label>
      <label>VEHICLE<select id="car"></select></label>
      <label>LIGHTING<select id="lighting"><option value="golden">Golden hour</option><option value="day">Afternoon</option><option value="night">Blue hour</option></select></label>
      <label>START AT<select id="location"></select></label>
    </div>
    <div class="menu-footer" hidden><button id="sound" aria-pressed="false">SOUND OFF</button><button id="quality">HIGH QUALITY</button><button id="fullscreen">FULLSCREEN</button></div>
  </section>
  <div id="debug" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body></html>
